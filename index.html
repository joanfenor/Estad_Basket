<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estad_Basket</title>
<meta name="theme-color" content="#1d4f7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estad_Basket">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var _t=localStorage.getItem("estad_basket.theme");if(_t==="light"||_t==="dark")document.documentElement.setAttribute("data-theme",_t)}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: una columna de móvil; la pista de parquet es el objeto central, botones grandes debajo, barra fija de deshacer abajo */
:root{
  --bg:#e9eef2; --surface:#ffffff; --surface-2:#f4f7f9; --ink:#14202b; --muted:#5b6b79; --line:#d3dce3;
  --accent:#d4561d; --accent-ink:#ffffff; --team:#1d4f7a; --made:#178a52; --miss:#c23a2c;
  --neg-tint:#fbeeea; --warnc:#b86a00;
  --f-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
  --band:#1d4f7a; --band-ink:#ffffff; --wood-a:#d9a668; --wood-b:#cb9455; --wood-c:#e0b277;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161e; --surface:#16212c; --surface-2:#1c2936; --ink:#e7eef4; --muted:#93a4b3; --line:#2a3947;
  --accent:#ee6b31; --accent-ink:#1a0d05; --team:#3a7cb5; --made:#3fbf7f; --miss:#ef6352; --neg-tint:#2a1d1b; --warnc:#f2a541; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161e; --surface:#16212c; --surface-2:#1c2936; --ink:#e7eef4; --muted:#93a4b3; --line:#2a3947;
  --accent:#ee6b31; --accent-ink:#1a0d05; --team:#3a7cb5; --made:#3fbf7f; --miss:#ef6352; --neg-tint:#2a1d1b; --warnc:#f2a541; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.05;text-wrap:balance}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r);font-weight:600;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-family:var(--f-display);font-size:20px;letter-spacing:.03em}
.btn.ghost{background:transparent}
.btn.danger{color:var(--miss);border-color:var(--miss)}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.live{color:var(--accent);border-color:var(--accent)}
.chip.win{color:var(--made);border-color:var(--made)}
.chip.loss{color:var(--miss);border-color:var(--miss)}
.chip.ex{border-style:dashed}

/* Home */
.hero{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:20px 18px 34px;border-radius:16px;overflow:hidden;color:var(--band-ink);
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(0,0,0,.18)),var(--band)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;border-top:2px solid rgba(255,255,255,.85);
  background:repeating-linear-gradient(90deg,var(--wood-a) 0 14px,var(--wood-b) 14px 28px,var(--wood-c) 28px 42px)}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border:2px solid rgba(255,255,255,.16);border-radius:50%}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.hero h1{font-size:42px;position:relative;overflow-wrap:anywhere}
.hero > *{position:relative;min-width:0}
.dorsal{font-family:var(--f-display);font-weight:700;font-size:52px;color:#ff8a4c;line-height:1}
.theme-seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:10px;padding:4px;gap:4px}
.theme-seg button{min-height:40px;border-radius:8px;font-weight:600;font-size:15px;color:var(--muted)}
.theme-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.live-card{display:flex;justify-content:space-between;align-items:center;gap:12px;border-color:var(--accent);border-width:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.tile span{font-size:13px;color:var(--muted)}
.games{display:flex;flex-direction:column}
.game-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);text-align:left;width:100%}
.game-row:first-child{border-top:0}
.game-row .date{font-family:var(--f-display);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;width:46px}
.game-row .vs{font-weight:600;min-width:0;overflow-wrap:anywhere}
.game-row .pts{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.game-row .pts small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.section-head h2{font-size:24px}

/* Forms */
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=url],input[type=date],input[type=number],textarea{font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%;box-sizing:border-box}
textarea{font-size:16px;min-height:96px;resize:vertical}
select{font:inherit;font-size:15px;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%;min-width:0}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.seg.c4{grid-template-columns:repeat(4,1fr)}
.seg.c4 label{font-size:16px}
.fieldset{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qsel{display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px}
.qsel span{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;color:var(--muted);padding:0 8px;text-transform:uppercase}
.qsel button{min-height:40px;border-radius:8px;font-family:var(--f-display);font-weight:700;font-size:19px;color:var(--muted)}
.qsel button[aria-pressed="true"]{background:var(--team);color:#fff}
.stat.neg.f4{border:2px solid var(--warnc);background:var(--surface)}
.stat.neg.f4 .c,.stat.neg.f4 .l{color:var(--warnc)}
.stat.neg.f5{background:var(--miss);border-color:var(--miss)}
.stat.neg.f5 .c,.stat.neg.f5 .l{color:#fff}
.qt-wrap{overflow-x:auto}
table.qt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.qt th{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;color:var(--muted);text-align:right;padding:4px 6px;text-transform:uppercase}
table.qt td{text-align:right;padding:8px 5px;white-space:nowrap;border-top:1px solid var(--line);font-family:var(--f-display);font-weight:600;font-size:18px}
table.qt th:first-child,table.qt td:first-child{text-align:left;font-family:var(--f-body);font-size:15px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink)}
table.qt td.v{color:var(--accent)}
.record{display:flex;gap:12px;align-items:center;border:2px solid var(--accent);background:var(--surface)}
.record svg{flex:none}
.notes-txt{white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
.rec-list{display:flex;flex-direction:column}
.rec-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.rec-row:first-child{border-top:0}
.rec-row b{font-family:var(--f-display);font-size:26px;line-height:1;text-align:right;grid-row:span 2;align-self:center;font-variant-numeric:tabular-nums}
.rec-row .k{font-weight:600}
.rec-row .w{font-size:13px;color:var(--muted)}
.chart{display:block;width:100%;height:auto}
.legend i.l2{background:var(--team)}
.legend i.l1{background:var(--accent)}
.link-btn{justify-content:space-between;width:100%;margin-top:12px}
.form{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 96px;gap:10px}

/* Game */
.gbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gbar .who{text-align:center;min-width:0}
.gbar .who h2{font-size:22px;overflow-wrap:anywhere}
.gbar .btn{min-height:40px;padding:0 12px;font-size:15px;white-space:nowrap}
.score{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:6px;align-items:stretch}
.score > div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.score b{display:block;font-family:var(--f-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.score span{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.score .pts{background:var(--ink);border-color:var(--ink)}
.score .pts b{font-size:34px;color:var(--bg)}
.score .pts span{color:var(--bg);opacity:.75}
.score .val{border-color:var(--accent);border-width:2px}
.score .val b{color:var(--accent)}
.court-wrap{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.flip-btn{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(14,26,38,.78);color:#fff;border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.flip-btn.top{bottom:auto;top:10px}
.flip-btn svg{width:24px;height:24px}
.pause-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(14,26,38,.18)}
.pause-ov i{display:block;width:22px;height:78px;margin:0 9px;border-radius:6px;background:#fff;box-shadow:0 0 0 3px rgba(194,58,44,.9);animation:pz 2.4s ease-in-out infinite}
@keyframes pz{0%,100%{opacity:.3}50%{opacity:.85}}
.btn.resume{background:var(--miss);border-color:var(--miss);color:#fff}
.dock .btn{min-height:46px;padding:0 14px}
.court{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.court.tap{cursor:crosshair}
.hint{margin:-6px 0 0;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:16px;font-weight:600;color:var(--ink)}
.hint svg{width:20px;height:20px;color:var(--accent);flex:none}
.ft{display:grid;grid-template-columns:auto 1fr 1fr 56px;gap:8px;align-items:center}
.ft button.pz{border:2px solid var(--line);color:var(--ink);background:var(--surface);padding:0}
.ft button.pz svg{width:26px;height:26px}
.ft button.pz.on{background:var(--miss);border-color:var(--miss);color:#fff}
.ft button.pz:disabled{opacity:.35}
.ft .lbl{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.04em;padding-right:4px}
.ft button{min-height:56px;border-radius:var(--r);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--made);color:var(--made);background:var(--surface)}
.ft button.miss{border-color:var(--miss);color:var(--miss)}
.ft .c{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:6px 4px;text-align:center}
.stat .c{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:14px;font-weight:600;line-height:1.15;color:var(--ink)}
.stat .top{display:flex;align-items:center;gap:6px}
.stat .ic{display:flex;color:var(--team)}
.stat .ic svg{width:30px;height:30px}
.stat.neg .ic{color:var(--miss)}
.stat.neg.f5 .ic{color:#fff}
.stat.neg.f4 .ic{color:var(--warnc)}
.stat.neg{background:var(--neg-tint)}
.stat.neg .c{color:var(--miss)}
.stat:not(.neg) .c{color:var(--team)}
.stat:active,.ft button:active,.bigpair button:active{transform:scale(.96)}
.stat,.ft button,.bigpair button{transition:transform .08s ease}
.stat.bump,.ft button.bump{animation:bump .25s ease}
@keyframes bump{50%{transform:scale(.94)}}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dock .last{flex:1;min-width:0;font-size:14px;line-height:1.25}
.dock .last b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved{color:var(--made)}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,16,22,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:18px 18px 0 0;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .18s ease-out}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(30%);opacity:.4}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:4px;gap:4px}
.seg button{min-height:44px;border-radius:8px;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg label{position:relative;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:8px;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted);cursor:pointer}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.sheet{max-height:92vh;overflow-y:auto}
.share-prev{display:block;max-width:100%;max-height:44vh;margin:0 auto;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.share-wait{display:flex;align-items:center;justify-content:center;min-height:160px;background:var(--surface-2);border-radius:10px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.clock{display:flex;flex-direction:column;gap:10px;padding:12px}
.clock-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.clock-top .q{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.05}
.clock-top .q small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.clock-top .row{flex-wrap:nowrap;gap:6px}
.clock-top .btn{min-height:42px;padding:0 12px;font-size:15px;white-space:nowrap}
.court-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;border-radius:var(--r);padding:8px 16px;text-align:left;border:2px solid var(--line);background:var(--surface-2)}
.court-toggle .st{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.03em;line-height:1}
.court-toggle .st small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:0;margin-top:3px;opacity:.85}
.court-toggle .tm{font-family:var(--f-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.court-toggle.on{background:var(--made);border-color:var(--made);color:#fff}
.court-toggle.off{color:var(--muted)}
.court-toggle.rest{border-style:dashed;color:var(--muted);cursor:default}
.clock-sum{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.clock-sum b{color:var(--ink)}
.warnbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:2px solid var(--warnc);border-radius:var(--r);padding:10px 12px;background:var(--surface)}
.warnbar p{margin:0;font-weight:600;color:var(--warnc)}
.bigpair button.bench{background:var(--muted)}
.rot{display:block;width:100%;height:auto}
.legend i.on{background:var(--team);border-radius:3px}
.legend i.off{background:var(--surface-2);border:1px solid var(--line);border-radius:3px}
.hero-main{display:flex;align-items:center;gap:14px;min-width:0}
.avatar{flex:none;width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3);background:#2b6698}
.hero-cat{margin-top:4px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;color:rgba(255,255,255,.85)}
.hero-pencil{position:absolute;top:12px;right:12px;z-index:2;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.5)}
.hero-pencil svg{width:20px;height:20px}
.photo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.photo-prev{width:84px;height:84px;border-radius:50%;background:var(--surface-2) center/cover no-repeat;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.photo-prev svg{width:40px;height:40px}
.photo-row label.btn{cursor:pointer}
.hero-edit{display:inline-flex;align-items:center;gap:6px;margin-top:10px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.45);color:#fff;font-size:14px;font-weight:600;background:rgba(255,255,255,.08)}
.actions{display:flex;flex-direction:column;gap:8px}
.actions .btn{width:100%;justify-content:flex-start}
.actions .btn.primary{justify-content:center;font-size:18px}
.actions .btn.pending{border:2px solid var(--miss);color:var(--miss)}
.valinfo{cursor:pointer}
.ib{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;border:1.5px solid currentColor;font:700 11px/1 var(--f-body);font-style:normal;margin-left:5px;vertical-align:2px;opacity:.75}
.valpop{position:fixed;z-index:40;width:min(330px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 32px rgba(0,0,0,.28);padding:14px 16px;font-size:14px;line-height:1.35}
.valpop h4{margin:0 0 6px;font-family:var(--f-display);font-size:20px}
.valpop table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.valpop td{padding:3px 0}
.valpop td:last-child{text-align:right;font-family:var(--f-display);font-weight:700;font-size:16px}
.valpop .plus td:last-child{color:var(--made)}
.valpop .minus td:last-child{color:var(--miss)}
.valpop .zero td{color:var(--muted)}
.valpop .tot td{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.valpop .tot td:last-child{color:var(--accent);font-size:20px}
.valpop p{margin:8px 0 0;color:var(--muted);font-size:13px}
.legend i.pz{width:14px;height:6px;border-radius:2px;background:var(--muted);opacity:.55;vertical-align:2px}
.bigpair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigpair button{min-height:84px;border-radius:14px;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.03em;color:#fff;background:var(--made)}
.bigpair button.miss{background:var(--miss)}

/* Detail */
.result{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.result .big{font-family:var(--f-display);font-weight:700;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
table.st{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.st td{padding:8px 4px;border-top:1px solid var(--line)}
table.st tr:first-child td{border-top:0}
table.st td:last-child{text-align:right;font-family:var(--f-display);font-weight:600;font-size:19px}
table.st td .pct{color:var(--muted);font-size:14px;font-weight:500;margin-left:6px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--made);vertical-align:-1px;margin-right:4px}
.legend i.x{background:none;border-radius:0;position:relative}
.legend i.x::before,.legend i.x::after{content:"";position:absolute;left:5px;top:-1px;width:2px;height:14px;background:var(--miss);transform:rotate(45deg)}
.legend i.x::after{transform:rotate(-45deg)}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.warn{background:var(--neg-tint);border:1px solid var(--miss);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
.endscore{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.endscore input{font-family:var(--f-display);font-size:40px;text-align:center;font-weight:700;padding:8px}
.endscore .dash{font-family:var(--f-display);font-size:40px;padding-bottom:10px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.pause-ov i{opacity:.7}}
@media (max-width:370px){.score b{font-size:19px}.score .pts b{font-size:28px}.stat .l{font-size:12px}}
</style>

function seasonsList(){var set={};set[seasonOf(today())]=1;games().forEach(function(g){if(g.date)set[seasonOf(g.date)]=1});return Object.keys(set).sort().reverse()}
function curSeason(){var l=seasonsList();if(S.viewSeason&&l.indexOf(S.viewSeason)>=0)return S.viewSeason;var gs=games();return gs.length?seasonOf(gs[0].date):seasonOf(today())}
function seasonPool(se){var f=finals().filter(function(g){return seasonOf(g.date)===se}),real=f.filter(function(g){return !g.example});
  if(real.length)return real;return realGames().filter(function(g){return g.status==="final"}).length?[]:f}
function before(a,b){return (a.date||"")<(b.date||"")||((a.date||"")===(b.date||"")&&(a.createdAt||0)<(b.createdAt||0))}
function recordsOf(list){var out={};RECS.forEach(function(m){var best=null;list.forEach(function(g){var v=calc(g)[m[0]];if(v>0&&(!best||v>best.v||(v===best.v&&before(g,best.g))))best={v:v,g:g}});out[m[0]]=best});return out}
function newRecords(g){
  if(g.example||g.status!=="final")return [];
  var prev=realGames().filter(function(o){return o.status==="final"&&o.id!==g.id&&before(o,g)});
  if(!prev.length)return [];
  var c=calc(g),out=[];
  RECS.forEach(function(m){var mx=Math.max.apply(null,prev.map(function(o){return calc(o)[m[0]]}));if(c[m[0]]>0&&c[m[0]]>mx)out.push({k:m[0],l:m[1],v:c[m[0]],prev:mx})});
  return out;
}

  '<rect x="0" y="0" width="150" height="112" fill="url(#wood)"/>'+

  '<rect x="50.5" y="0" width="49" height="58" fill="#1d4f7a" fill-opacity=".9"/>'+
  '<rect x="0" y="0" width="150" height="112" fill="url(#sheen)"/><rect x="0" y="0" width="150" height="112" fill="url(#sheenr)"/>'+
  '<g fill="none" stroke="#fff" stroke-width=".55">'+
   '<path d="M0 112V0H150V112"/><rect x="50.5" y="0" width="49" height="58"/>'+
   '<path d="M57 58A18 18 0 0 0 93 58"/><path d="M57 58A18 18 0 0 1 93 58" stroke-dasharray="2.2 2"/>'+
   '<path d="M62.5 12V15.75A12.5 12.5 0 0 0 87.5 15.75V12"/>'+

   '<path d="'+hashes+'"/>'+
   '<path d="M0 112H150" stroke-width=".9" stroke-opacity=".9"/>'+
   '<path d="M57 112A18 18 0 0 1 93 112"/>'+
  '</g>'+
  '<path d="M66 12H84" stroke="#fff" stroke-width="1"/><path d="M75 12V13.5" stroke="#fff" stroke-width=".5"/>'+

function rotCard(g,tm){
  var qs=Object.keys(tm.per).map(Number).filter(function(q){return tm.per[q].done}).sort(function(a,b){return a-b});

  qs.forEach(function(q,i){var p=tm.per[q],y=i*RH+6,span=p.b-p.a,X=function(t){return X0+(t-p.a)/span*(X1-X0)};
    o+='<text x="0" y="'+(y+13)+'" style="font:600 12px var(--f-display);fill:var(--muted)">'+qShort(q)+'</text>';
    o+='<rect x="'+X0+'" y="'+y+'" width="'+(X1-X0)+'" height="18" rx="4" fill="var(--surface-2)" stroke="var(--line)"/>';
    tm.segs.forEach(function(sg){var s0=Math.max(sg[0],p.a),s1=Math.min(sg[1],p.b);if(s1>s0)o+='<rect x="'+X(s0).toFixed(1)+'" y="'+y+'" width="'+Math.max(1.5,X(s1)-X(s0)).toFixed(1)+'" height="18" rx="3" fill="var(--team)"/>'});
    tm.pauses.forEach(function(ps){var s0=Math.max(ps[0],p.a),s1=Math.min(ps[1],p.b);if(s1>s0)o+='<rect x="'+X(s0).toFixed(1)+'" y="'+(y+6)+'" width="'+Math.max(1.5,X(s1)-X(s0)).toFixed(1)+'" height="6" fill="var(--muted)" opacity=".5"/>'});
    o+='<text x="'+W+'" y="'+(y+14)+'" text-anchor="end" style="font:700 15px var(--f-display);fill:var(--ink)">'+fmtMin(qSec(g,tm,q))+'</text>';
  });
  o+='</svg>';
  return '<section class="card"><div class="section-head"><h2>Rotaciones</h2><span class="legend"><span><i class="on"></i>En pista</span><span><i class="off"></i>Banquillo</span>'+(tm.pauses.length?'<span><i class="pz"></i>Pausa</span>':"")+'</span></div>'+o+
    '<p class="small muted" style="margin:8px 0 0">Cada barra es un cuarto en tiempo real. A la derecha, minutos de juego '+(g.minManual!=null&&g.minManual!==""?'ajustados para sumar los '+String(g.minManual).replace(".",",")+' min del acta':'calculados (cuartos de '+(g.qLen||10)+' min)')+'.'+(tm.pauses.length?' La raya gris marca las pausas, que no cuentan.':'')+'</p></section>';
}
function chartSVG(list){
  var n=list.length;if(n<2)return '<p class="muted" style="margin:0">Con 2 partidos o más verás aquí cómo evoluciona.</p>';
  var cs=list.map(function(g){return calc(g)}), W=340,H=190,L=30,R=14,T=16,B=28;
  var mx=5,mn=0;cs.forEach(function(c){mx=Math.max(mx,c.pts,c.val);mn=Math.min(mn,c.val)});
  var raw=(mx-mn)/4,step=[1,2,5,10,15,20,25,50].filter(function(s){return s>=raw})[0]||50;
  var top=Math.ceil(mx/step)*step,bot=Math.floor(mn/step)*step;
  var X=function(i){return L+i*(W-L-R)/(n-1)},Y=function(v){return T+(top-v)*(H-T-B)/(top-bot)};
  var o='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Puntos y valoración por partido">';
  for(var v=bot;v<=top;v+=step){o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="'+(v===0?1.4:.8)+'"/><text x="'+(L-6)+'" y="'+(Y(v)+3.5)+'" text-anchor="end" style="font:10px var(--f-body);fill:var(--muted)">'+v+'</text>'}
  var line=function(k){return cs.map(function(c,i){return (i?"L":"M")+X(i).toFixed(1)+" "+Y(c[k]).toFixed(1)}).join("")};
  o+='<path d="'+line("pts")+"L"+X(n-1)+" "+Y(Math.max(bot,0))+"L"+X(0)+" "+Y(Math.max(bot,0))+'Z" fill="var(--accent)" fill-opacity=".10"/>';
  [["val","var(--team)"],["pts","var(--accent)"]].forEach(function(sr){
    o+='<path d="'+line(sr[0])+'" fill="none" stroke="'+sr[1]+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    cs.forEach(function(c,i){var last=i===n-1;o+='<circle cx="'+X(i)+'" cy="'+Y(c[sr[0]])+'" r="'+(last?4.5:2.6)+'" fill="'+(last?sr[1]:"var(--surface)")+'" stroke="'+sr[1]+'" stroke-width="1.8"/>'});
    var lc=cs[n-1][sr[0]];o+='<text x="'+(X(n-1)-8)+'" y="'+(Y(lc)-8)+'" text-anchor="end" style="font:600 12px var(--f-display);fill:'+sr[1]+'">'+lc+'</text>';
  });
  var idx=n<=6?list.map(function(_,i){return i}):[0,Math.round((n-1)/3),Math.round(2*(n-1)/3),n-1];
  idx.forEach(function(i){o+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="'+(i===0?"start":i===n-1?"end":"middle")+'" style="font:10px var(--f-body);fill:var(--muted)">'+fmtDate(list[i].date)+'</text>'});
  return o+'</svg>';
}

function shareText(name,text,mime,title,done){shareBlob(new Blob([text],{type:mime}),name,title,done)}
function shareBlob(blob,name,title,done){
  var mime=blob.type, file=null;
  try{file=new File([blob],name,{type:mime})}catch(e){}
  if(file&&navigator.canShare&&navigator.share){
    var ok=false;try{ok=navigator.canShare({files:[file]})}catch(e){}
    if(ok){navigator.share({files:[file],title:title}).then(function(){done("shared")},function(err){if(err&&err.name==="AbortError")done("cancel");else{saveBlob(blob,name);done("saved")}});return}
  }
  saveBlob(blob,name);done("saved");
}

function doCSV(){

  if(!gs.length){notice="Aún no hay partidos terminados para exportar.";render();return}
  var head=["Fecha","Temporada","Competición","Categoría","Rival","Lugar","Jugador","Dorsal","Nuestro equipo","Rival puntos","Minutos","Puntos","T2 anotados","T2 intentos","T3 anotados","T3 intentos","TL anotados","TL intentos","Rebotes ataque","Rebotes defensa","Rebotes","Asistencias","Robos","Tapones","Faltas recibidas","Pérdidas","Tapones recibidos","Faltas","Valoración","Zona anotados","Zona intentos","Media dist. anotados","Media dist. intentos","Notas"];

function doImport(raw){
  try{var d=JSON.parse(raw);if(!d||!Array.isArray(d.games))throw 0;
    var hadReal=realGames().length>0, n=0;
    d.games.forEach(function(g){if(!g||!g.id||!Array.isArray(g.events))return;var l=S.games[g.id];if(!l||(g.updatedAt||0)>(l.updatedAt||0)){S.games[g.id]=g;if(syncOn()&&S.pending.indexOf(g.id)<0)S.pending.push(g.id);n++}});
    if(d.player&&!hadReal)S.player=d.player;
    if(n&&S.games.ejemplo)delete S.games.ejemplo;
    persist();scheduleSync();notice=n?("Restaurados "+n+(n===1?" partido.":" partidos.")):"Esa copia no tiene partidos nuevos para este móvil.";view="home";render();
  }catch(e){notice="Ese archivo no es una copia de Estad_Basket. Elige el archivo «estad_basket-copia-…» (o «estadillo-copia-…») que guardaste.";render()}

function rrect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function fitFont(x,text,weight,size,family,maxW){var s=size;do{x.font=weight+" "+s+"px "+family;if(x.measureText(text).width<=maxW)break;s-=2}while(s>18);return s}
function wrapLines(x,text,maxW){var out=[];String(text).split(/\n/).forEach(function(par){var line="";par.split(/\s+/).forEach(function(w){var t=line?line+" "+w:w;if(x.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});out.push(line)});return out}
function closeShare(){shareSheet=false;shareTok++;shareReady=null;shareBusy=false;if(shareURL){try{URL.revokeObjectURL(shareURL)}catch(e){}shareURL=null}}

/* ---------- Explicación de la valoración ---------- */
var valPopEl=null,valPopY=0;
function closeValPop(){if(valPopEl){valPopEl.remove();valPopEl=null}}
function valPopHTML(scope,id){
  var rows,head,foot;
  if(scope==="season"){
    var basis=seasonPool(curSeason()),n=basis.length||1,t={pts:0,reb:0,ast:0,stl:0,blk:0,fd:0,mfg:0,mft:0,tov:0,blka:0,pf:0,val:0};
    basis.forEach(function(g){var c=calc(g);t.pts+=c.pts;t.reb+=c.reb;t.ast+=c.ast;t.stl+=c.stl;t.blk+=c.blk;t.fd+=c.fd;t.mfg+=(c.a2-c.m2)+(c.a3-c.m3);t.mft+=c.aft-c.mft;t.tov+=c.tov;t.blka+=c.blka;t.pf+=c.pf;t.val+=c.val});
    var a=function(v){return (v/n).toFixed(1).replace(".",",")};
    rows=[["Puntos",a(t.pts),1],["Rebotes",a(t.reb),1],["Asistencias",a(t.ast),1],["Robos",a(t.stl),1],["Tapones",a(t.blk),1],["Faltas recibidas",a(t.fd),1],
          ["Tiros de campo fallados",a(t.mfg),0],["Tiros libres fallados",a(t.mft),0],["Pérdidas",a(t.tov),0],["Tapones recibidos",a(t.blka),0],["Faltas cometidas",a(t.pf),0]];
    head="Valoración media";foot=["Valoración media",a(t.val)];
  } else {
    var g=S.games[id];if(!g)return "";var c=calc(g);
    rows=[["Puntos",c.pts,1],["Rebotes",c.reb,1],["Asistencias",c.ast,1],["Robos",c.stl,1],["Tapones",c.blk,1],["Faltas recibidas",c.fd,1],
          ["Tiros de campo fallados",(c.a2-c.m2)+(c.a3-c.m3),0],["Tiros libres fallados",c.aft-c.mft,0],["Pérdidas",c.tov,0],["Tapones recibidos",c.blka,0],["Faltas cometidas",c.pf,0]];
    head="Cómo se calcula la valoración";foot=["Valoración",c.val];
  }
  return '<h4>'+head+'</h4><table><tbody>'+rows.map(function(rw){var z=String(rw[1]).replace(",",".")==0;return '<tr class="'+(z?"zero":rw[2]?"plus":"minus")+'"><td>'+rw[0]+'</td><td>'+(z?"0":(rw[2]?"+":"−")+rw[1])+'</td></tr>'}).join("")+
    '<tr class="tot"><td>= '+foot[0]+'</td><td>'+foot[1]+'</td></tr></tbody></table><p>Fórmula de la ACB y la FEB: suma lo positivo y resta los fallos, pérdidas, tapones recibidos y faltas.</p>';
}
function openValPop(el){
  closeValPop();
  var html=valPopHTML(el.getAttribute("data-scope"),el.getAttribute("data-id"));if(!html)return;
  var d=document.createElement("div");d.className="valpop";d.setAttribute("role","dialog");d.innerHTML=html;document.body.appendChild(d);valPopEl=d;
  var rc=el.getBoundingClientRect(),w=d.offsetWidth,h=d.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
  var left=Math.min(Math.max(12,rc.left+rc.width/2-w/2),vw-w-12),top=rc.bottom+8;

/* ---------- Pantalla siempre encendida ---------- */
var wake=null;
function requestWake(){try{if(navigator.wakeLock&&!wake){navigator.wakeLock.request("screen").then(function(w){wake=w;w.addEventListener("release",function(){wake=null})}).catch(function(){})}}catch(e){}}

/* ---------- Copia en Google Sheets ---------- */
if(!S.sync)S.sync={url:"",token:""};
var cloud={status:"off"}, syncTimer=null, flushing=false, showSync=false;
function syncOn(){return false}
function setCloud(s){if(cloud.status===s)return;cloud.status=s;if(view==="home")render()}
function scheduleSync(){if(!syncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(flush,2500)}
function api(payload){
  var ctrl=("AbortController" in window)?new AbortController():null, t=setTimeout(function(){ctrl&&ctrl.abort()},25000);
  return fetch(S.sync.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({token:S.sync.token},payload)),signal:ctrl?ctrl.signal:undefined})
    .then(function(r){clearTimeout(t);if(!r.ok)throw new Error("http");return r.json()})
    .then(function(d){if(!d||!d.ok)throw new Error(d&&d.error||"respuesta");return d},function(e){clearTimeout(t);throw e});
}
function flush(){
  if(!syncOn()||flushing)return;
  if(!S.pending.length){setCloud("ok");return}
  flushing=true;setCloud("sync");
  var batch=S.pending.map(function(id){return S.games[id]}).filter(function(g){return g&&!g.example});
  var vers={};batch.forEach(function(g){vers[g.id]=g.updatedAt});
  api({action:"save",games:batch}).then(function(){
    S.pending=S.pending.filter(function(id){var g=S.games[id];return g&&!g.example&&g.updatedAt!==vers[id]});
    flushing=false;persist();setCloud(S.pending.length?"pending":"ok");if(S.pending.length)scheduleSync();
  },function(err){flushing=false;setCloud(err&&err.message==="token"?"badtoken":"pending")});
}
function pull(manual){
  if(!syncOn())return;
  setCloud("sync");
  api({action:"list"}).then(function(d){
    var changed=0,remote={};
    (d.games||[]).forEach(function(r){if(!r||!r.id)return;remote[r.id]=r.updatedAt||0;var l=S.games[r.id];
      if(!l||(r.updatedAt||0)>(l.updatedAt||0)){if(r.id===currentId&&view==="game")return;S.games[r.id]=r;changed++}});
    Object.keys(S.games).forEach(function(k){var g=S.games[k];if(g.example)return;
      if(!(k in remote)||(g.updatedAt||0)>remote[k]){if(S.pending.indexOf(k)<0)S.pending.push(k)}});
    persist();
    if(manual)notice=changed?("Recuperados "+changed+(changed===1?" partido":" partidos")+" de la hoja."):"La hoja no tiene partidos que no estén ya en este móvil.";
    setCloud(S.pending.length?"pending":"ok");
    if(view!=="game")render();
    flush();
  },function(err){setCloud(err&&err.message==="token"?"badtoken":"pending");if(manual){notice="No se ha podido leer la hoja. Revisa la conexión, la dirección y la clave.";render()}});
}
window.addEventListener("online",flush);
setInterval(function(){if(S.pending.length)flush()},30000);

/* ---------- Arranque ---------- */
function start(data){
  data=data||{};
  if(data.view){view=data.view;currentId=data.currentId||null}
  else if(S.activeId&&S.games[S.activeId]&&S.games[S.activeId].status==="live"){view="game";currentId=S.activeId;requestWake()}
  render();
  if(syncOn())pull(false);
}
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(reg){try{reg.update()}catch(e){}}).catch(function(){})})}
start({});
})();
