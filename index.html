<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estadillo del Jugador</title>
<meta name="theme-color" content="#1d4f7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estadillo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: una columna de móvil; la pista de parquet es el objeto central, botones grandes debajo, barra fija de deshacer abajo */
:root{
  --bg:#e9eef2; --surface:#ffffff; --surface-2:#f4f7f9; --ink:#14202b; --muted:#5b6b79; --line:#d3dce3;
  --accent:#d4561d; --accent-ink:#ffffff; --team:#1d4f7a; --made:#178a52; --miss:#c23a2c;
  --neg-tint:#fbeeea;
  --f-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161e; --surface:#16212c; --surface-2:#1c2936; --ink:#e7eef4; --muted:#93a4b3; --line:#2a3947;
  --accent:#ee6b31; --accent-ink:#1a0d05; --team:#3a7cb5; --made:#3fbf7f; --miss:#ef6352; --neg-tint:#2a1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161e; --surface:#16212c; --surface-2:#1c2936; --ink:#e7eef4; --muted:#93a4b3; --line:#2a3947;
  --accent:#ee6b31; --accent-ink:#1a0d05; --team:#3a7cb5; --made:#3fbf7f; --miss:#ef6352; --neg-tint:#2a1d1b; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.05;text-wrap:balance}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r);font-weight:600;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-family:var(--f-display);font-size:20px;letter-spacing:.03em}
.btn.ghost{background:transparent}
.btn.danger{color:var(--miss);border-color:var(--miss)}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.live{color:var(--accent);border-color:var(--accent)}
.chip.win{color:var(--made);border-color:var(--made)}
.chip.loss{color:var(--miss);border-color:var(--miss)}
.chip.ex{border-style:dashed}

/* Home */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:8px}
.hero h1{font-size:44px}
.dorsal{font-family:var(--f-display);font-weight:700;font-size:44px;color:var(--accent);line-height:1}
.live-card{display:flex;justify-content:space-between;align-items:center;gap:12px;border-color:var(--accent);border-width:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.tile span{font-size:13px;color:var(--muted)}
.games{display:flex;flex-direction:column}
.game-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);text-align:left;width:100%}
.game-row:first-child{border-top:0}
.game-row .date{font-family:var(--f-display);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;width:46px}
.game-row .vs{font-weight:600;min-width:0;overflow-wrap:anywhere}
.game-row .pts{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.game-row .pts small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.section-head h2{font-size:24px}

/* Forms */
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=url],input[type=date],input[type=number],textarea{font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%;box-sizing:border-box}
textarea{font-size:13px;font-family:ui-monospace,Menlo,monospace;min-height:110px}
.form{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 96px;gap:10px}

/* Game */
.gbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gbar .who{text-align:center;min-width:0}
.gbar .who h2{font-size:22px;overflow-wrap:anywhere}
.gbar .btn{min-height:40px;padding:0 12px;font-size:15px;white-space:nowrap}
.score{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:6px;align-items:stretch}
.score > div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.score b{display:block;font-family:var(--f-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.score span{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.score .pts{background:var(--ink);border-color:var(--ink)}
.score .pts b{font-size:34px;color:var(--bg)}
.score .pts span{color:var(--bg);opacity:.75}
.court-wrap{border-radius:var(--r);overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.court{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.court.tap{cursor:crosshair}
.hint{margin:-8px 0 0;text-align:center;font-size:14px;color:var(--muted)}
.ft{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center}
.ft .lbl{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.04em;padding-right:4px}
.ft button{min-height:56px;border-radius:var(--r);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--made);color:var(--made);background:var(--surface)}
.ft button.miss{border-color:var(--miss);color:var(--miss)}
.ft .c{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:76px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:6px 4px;text-align:center}
.stat .c{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;line-height:1.15;color:var(--muted)}
.stat.neg{background:var(--neg-tint)}
.stat.bump,.ft button.bump{animation:bump .25s ease}
@keyframes bump{50%{transform:scale(.94)}}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dock .last{flex:1;min-width:0;font-size:14px;line-height:1.25}
.dock .last b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved{color:var(--made)}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,16,22,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:18px 18px 0 0;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .18s ease-out}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(30%);opacity:.4}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:4px;gap:4px}
.seg button{min-height:44px;border-radius:8px;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg label{position:relative;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:8px;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted);cursor:pointer}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.bigpair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigpair button{min-height:84px;border-radius:14px;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.03em;color:#fff;background:var(--made)}
.bigpair button.miss{background:var(--miss)}

/* Detail */
.result{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.result .big{font-family:var(--f-display);font-weight:700;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
table.st{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.st td{padding:8px 4px;border-top:1px solid var(--line)}
table.st tr:first-child td{border-top:0}
table.st td:last-child{text-align:right;font-family:var(--f-display);font-weight:600;font-size:19px}
table.st td .pct{color:var(--muted);font-size:14px;font-weight:500;margin-left:6px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--made);vertical-align:-1px;margin-right:4px}
.legend i.x{background:none;border-radius:0;position:relative}
.legend i.x::before,.legend i.x::after{content:"";position:absolute;left:5px;top:-1px;width:2px;height:14px;background:var(--miss);transform:rotate(45deg)}
.legend i.x::after{transform:rotate(-45deg)}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.warn{background:var(--neg-tint);border:1px solid var(--miss);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
.endscore{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.endscore input{font-family:var(--f-display);font-size:40px;text-align:center;font-weight:700;padding:8px}
.endscore .dash{font-family:var(--f-display);font-size:40px;padding-bottom:10px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (max-width:370px){.score b{font-size:19px}.score .pts b{font-size:28px}.stat .l{font-size:12px}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>

<script>
(function(){
"use strict";
var LS_KEY="estadillo.v1";
var STATS=[
  {k:"oreb",l:"Rebote ataque"},{k:"dreb",l:"Rebote defensa"},{k:"ast",l:"Asistencia",p:"Asistencias"},{k:"stl",l:"Robo",p:"Robos"},
  {k:"blk",l:"Tapón",p:"Tapones"},{k:"fd",l:"Falta recibida",p:"Faltas recibidas"},{k:"tov",l:"Pérdida",p:"Pérdidas",neg:true},{k:"pf",l:"Falta",p:"Faltas personales",neg:true}
];
var STAT_LABEL={};STATS.forEach(function(s){STAT_LABEL[s.k]=s.l});
var BASKET={x:75,y:15.75}, R3=67.5, CORNER_Y=29.9;

/* ---------- Estado y guardado local ---------- */
var storageOK=true;
function readLS(){try{var r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){storageOK=false;return null}}
var S=readLS();
if(!S||!S.games){S={player:{name:"Mi jugador",dorsal:""},games:{},activeId:null,pending:[]};seedExample();}
if(!S.pending)S.pending=[];
function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));storageOK=true;lastSaved=new Date()}catch(e){storageOK=false}}
var lastSaved=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function touch(g){g.updatedAt=Date.now();if(!g.example&&S.pending.indexOf(g.id)<0)S.pending.push(g.id);persist();scheduleSync()}

function seedExample(){
  var ev=[], shots=[[70,40,2,1],[60,10,2,0],[95,25,2,1],[20,60,3,0],[75,30,2,1],[130,70,3,1],[6,15,3,0],[82,20,2,1],[45,45,2,0],[110,55,2,1],[75,88,3,0],[88,35,2,1]];
  shots.forEach(function(s){ev.push({t:"shot",x:s[0],y:s[1],v:s[2],made:!!s[3]})});
  ["dreb","dreb","ast","stl","oreb","ast","tov","pf","dreb","fd","ast","blk"].forEach(function(k){ev.push({t:"stat",k:k})});
  ev.push({t:"ft",made:true},{t:"ft",made:false},{t:"ft",made:true});
  var id="ejemplo";
  S.games[id]={id:id,example:true,player:"Mi jugador",dorsal:"",rival:"CB Ejemplo",venue:"casa",date:new Date(Date.now()-6*864e5).toISOString().slice(0,10),status:"final",events:ev,final:{us:58,them:51},createdAt:Date.now(),updatedAt:Date.now()};
}

/* ---------- Cálculos ---------- */
function isThree(x,y){return y<=CORNER_Y?(x<9||x>141):Math.hypot(x-BASKET.x,y-BASKET.y)>R3}
function zoneOf(e){if(e.v===3)return "t3";if(e.x>=50.5&&e.x<=99.5&&e.y<=58)return "zona";return "media"}
function calc(g){
  var c={pts:0,m2:0,a2:0,m3:0,a3:0,mft:0,aft:0,zona:[0,0],media:[0,0],t3:[0,0]};
  STATS.forEach(function(s){c[s.k]=0});
  (g.events||[]).forEach(function(e){
    if(e.t==="shot"){var z=c[zoneOf(e)];z[1]++;if(e.made)z[0]++;
      if(e.v===3){c.a3++;if(e.made){c.m3++;c.pts+=3}}else{c.a2++;if(e.made){c.m2++;c.pts+=2}}}
    else if(e.t==="ft"){c.aft++;if(e.made){c.mft++;c.pts++}}
    else if(e.t==="stat"){c[e.k]=(c[e.k]||0)+1}
  });
  c.reb=c.oreb+c.dreb;return c;
}
function pct(m,a){return a?Math.round(100*m/a)+"%":"–"}
function games(){return Object.keys(S.games).map(function(k){return S.games[k]}).filter(function(g){return !g.deleted}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"")||b.createdAt-a.createdAt})}
function fmtDate(d,long){if(!d)return "";var p=d.split("-");if(long){var dt=new Date(+p[0],+p[1]-1,+p[2]);return dt.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}return p[2]+"/"+p[1]}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function describe(e){if(!e)return "";if(e.t==="shot")return "Tiro de "+e.v+" "+(e.made?"anotado":"fallado")+" ("+(Math.hypot(e.x-BASKET.x,e.y-BASKET.y)/10).toFixed(1).replace(".",",")+" m)";if(e.t==="ft")return "Tiro libre "+(e.made?"anotado":"fallado");return STAT_LABEL[e.k]||e.k}
function venueTxt(g){return g.venue==="fuera"?"Fuera":g.venue==="casa"?"En casa":""}
function resultChip(g){if(!g.final)return "";var w=g.final.us>g.final.them,l=g.final.us<g.final.them;return '<span class="chip '+(w?"win":l?"loss":"")+'">'+(w?"Ganado":l?"Perdido":"Empate")+" "+g.final.us+"–"+g.final.them+"</span>"}

/* ---------- Pista ---------- */
function courtSVG(shots,opt){
  opt=opt||{};
  var marks=shots.map(function(s,i){
    var hl=opt.highlightLast&&i===shots.length-1;
    if(s.made)return '<circle cx="'+s.x+'" cy="'+s.y+'" r="'+(hl?3:2.4)+'" fill="'+(opt.made||"#178a52")+'" stroke="#fff" stroke-width=".7"/>';
    var d=hl?2.4:1.9;
    return '<g stroke-linecap="round"><path d="M'+(s.x-d)+" "+(s.y-d)+"L"+(s.x+d)+" "+(s.y+d)+"M"+(s.x+d)+" "+(s.y-d)+"L"+(s.x-d)+" "+(s.y+d)+'" stroke="#fff" stroke-width="2"/><path d="M'+(s.x-d)+" "+(s.y-d)+"L"+(s.x+d)+" "+(s.y+d)+"M"+(s.x+d)+" "+(s.y-d)+"L"+(s.x-d)+" "+(s.y+d)+'" stroke="'+(opt.miss||"#c23a2c")+'" stroke-width="1.1"/></g>';
  }).join("");
  var pend=opt.pending?'<circle cx="'+opt.pending.x+'" cy="'+opt.pending.y+'" r="3.4" fill="none" stroke="#fff" stroke-width="1"/><circle cx="'+opt.pending.x+'" cy="'+opt.pending.y+'" r="1" fill="#fff"/>':"";
  var hashes="";[17.5,26,34.5,43].forEach(function(y){hashes+="M48.5 "+y+"H50.5M99.5 "+y+"H101.5"});
  return '<svg class="court'+(opt.tap?" tap":"")+'" id="'+(opt.id||"")+'" viewBox="-5 -5 160 117" role="img" aria-label="Media pista de baloncesto'+(opt.tap?', toca donde se ha tirado':'')+'">'+
  '<defs><pattern id="wood" width="6" height="48" patternUnits="userSpaceOnUse">'+
   '<rect width="3" height="20" fill="#d9a668"/><rect y="20" width="3" height="28" fill="#cf985a"/>'+
   '<rect x="3" width="3" height="9" fill="#e2b679"/><rect x="3" y="9" width="3" height="26" fill="#d6a062"/><rect x="3" y="35" width="3" height="13" fill="#dcab6d"/>'+
   '<path d="M3 0V48M0 20H3M3 9H6M3 35H6" stroke="#7a4a1e" stroke-opacity=".22" stroke-width=".14"/></pattern>'+
   '<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#4a2a0c" stop-opacity=".12"/></linearGradient></defs>'+
  '<rect x="-5" y="-5" width="160" height="117" fill="#1d4f7a"/>'+
  '<rect x="0" y="0" width="150" height="112" fill="url(#wood)"/>'+
  '<path d="M9 0V29.9A67.5 67.5 0 0 0 141 29.9V0Z" fill="#b97a3e" fill-opacity=".16"/>'+
  '<rect x="50.5" y="0" width="49" height="58" fill="#1d4f7a" fill-opacity=".9"/>'+
  '<rect x="0" y="0" width="150" height="112" fill="url(#sheen)"/>'+
  '<g fill="none" stroke="#fff" stroke-width=".55">'+
   '<path d="M0 112V0H150V112"/><rect x="50.5" y="0" width="49" height="58"/>'+
   '<path d="M57 58A18 18 0 0 0 93 58"/><path d="M57 58A18 18 0 0 1 93 58" stroke-dasharray="2.2 2"/>'+
   '<path d="M62.5 12V15.75A12.5 12.5 0 0 0 87.5 15.75V12"/>'+
   '<path d="M9 0V29.9A67.5 67.5 0 0 0 141 29.9V0"/>'+
   '<path d="'+hashes+'"/>'+

function renderDock(){

  d.innerHTML='<div class="dock-in"><div class="last"><b>'+(last?esc(describe(last)):"Sin acciones todavía")+'</b><span class="'+(storageOK?"saved":"")+'">'+(storageOK?"Guardado en el móvil"+(lastSaved?" · "+lastSaved.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}):""):"Sin guardar")+'</span></div><button class="btn" data-act="undo" '+(last?"":"disabled")+'>Deshacer</button></div>';

/* ---------- Acciones ---------- */
function buzz(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
function addEvent(e){var g=S.games[currentId];e.ts=Date.now();g.events.push(e);touch(g);buzz()}

function onCourtTap(ev){
  var svg=ev.currentTarget, pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;
  var m=svg.getScreenCTM();if(!m)return;var p=pt.matrixTransform(m.inverse());
  var x=Math.max(0,Math.min(150,p.x)), y=Math.max(0,Math.min(112,p.y));
  x=Math.round(x*10)/10;y=Math.round(y*10)/10;
  pendingShot={x:x,y:y,v:isThree(x,y)?3:2};render();
}

document.addEventListener("submit",function(ev){
  var f=ev.target.getAttribute("data-form");if(!f)return;ev.preventDefault();
  if(f==="new"){
    var rival=document.getElementById("ng-rival").value.trim();if(!rival){document.getElementById("ng-rival").focus();return}
    var name=document.getElementById("ng-name").value.trim()||S.player.name, dorsal=document.getElementById("ng-dorsal").value.trim();
    S.player={name:name,dorsal:dorsal};
    var g={id:uid(),player:name,dorsal:dorsal,rival:rival,venue:(document.querySelector('input[name="ng-venue"]:checked')||{}).value||"casa",date:document.getElementById("ng-date").value||today(),status:"live",events:[],final:null,createdAt:Date.now(),updatedAt:Date.now()};
    S.games[g.id]=g;S.activeId=g.id;currentId=g.id;view="game";touch(g);requestWake();render();window.scrollTo(0,0);
  } else if(f==="end"){
    var g2=S.games[currentId], us=document.getElementById("end-us").value, th=document.getElementById("end-them").value;
    g2.final=(us!==""&&th!=="")?{us:+us,them:+th}:null;g2.status="final";if(S.activeId===g2.id)S.activeId=null;
    touch(g2);releaseWake();view="detail";notice="";confirmDel=false;render();window.scrollTo(0,0);
  } else if(f==="sync"){
    var u=document.getElementById("sy-url").value.trim(), tk=document.getElementById("sy-token").value.trim();
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){notice="La dirección debe ser la de la aplicación web de Apps Script (https://script.google.com/…/exec).";render();return}
    if(!tk){notice="Falta la clave.";render();return}
    S.sync={url:u,token:tk};showSync=false;notice="";persist();render();pull(true);
  } else if(f==="player"){
    S.player={name:document.getElementById("pl-name").value.trim()||"Mi jugador",dorsal:document.getElementById("pl-dorsal").value.trim()};
    editPlayer=false;persist();render();
  }
});

document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act"), id=b.getAttribute("data-id");
  flash=null;
  if(a==="home"){view="home";notice="";pendingShot=null;releaseWake();render();window.scrollTo(0,0)}
  else if(a==="new"){view="new";render();window.scrollTo(0,0);var r=document.getElementById("ng-rival");if(r)r.focus()}
  else if(a==="open-game"){currentId=id;var g=S.games[id];g.status="live";S.activeId=id;persist();view="game";requestWake();render();window.scrollTo(0,0)}
  else if(a==="detail"){currentId=id;view="detail";confirmDel=false;notice="";render();window.scrollTo(0,0)}
  else if(a==="end"){view="end";pendingShot=null;render();window.scrollTo(0,0)}
  else if(a==="setv"){if(pendingShot){pendingShot.v=+b.getAttribute("data-v");render()}}
  else if(a==="cancel-shot"){pendingShot=null;render()}
  else if(a==="shot"){if(!pendingShot)return;addEvent({t:"shot",x:pendingShot.x,y:pendingShot.y,v:pendingShot.v,made:b.getAttribute("data-made")==="1"});pendingShot=null;render()}
  else if(a==="ft"){var mk=b.getAttribute("data-made")==="1";addEvent({t:"ft",made:mk});flash=mk?"ft1":"ft0";render()}
  else if(a==="stat"){var k=b.getAttribute("data-k");addEvent({t:"stat",k:k});flash=k;render()}
  else if(a==="undo"){var gu=S.games[currentId];if(gu&&gu.events.length){gu.events.pop();touch(gu);buzz();render()}}
  else if(a==="reopen"){var gr=S.games[currentId];gr.status="live";S.activeId=gr.id;touch(gr);view="game";requestWake();render();window.scrollTo(0,0)}
  else if(a==="ask-del"){confirmDel=true;render()}
  else if(a==="cancel-del"){confirmDel=false;render()}
  else if(a==="delete"){var gd=S.games[currentId];
    if(gd.example){delete S.games[currentId];persist()}
    else{S.games[currentId]={id:gd.id,deleted:true,createdAt:gd.createdAt,updatedAt:0};touch(S.games[currentId])}
    if(S.activeId===currentId)S.activeId=null;confirmDel=false;view="home";render()}
  else if(a==="edit-player"){editPlayer=true;render()}
  else if(a==="cancel-player"){editPlayer=false;render()}
  else if(a==="backup"){doBackup()}
  else if(a==="csv"){doCSV()}
  else if(a==="restore-file"){var inp=document.getElementById("restore-input");if(inp){inp.value="";inp.click()}}
  else if(a==="toggle-sync"){showSync=!showSync;notice="";render()}
  else if(a==="disconnect-sync"){S.sync={url:"",token:""};showSync=false;notice="Desconectado. Los partidos siguen en este móvil y en la hoja.";persist();setCloud("off");render()}
  else if(a==="push-sync"){notice="";if(!S.pending.length){notice="No hay cambios pendientes de enviar.";render()}else flush()}
  else if(a==="pull-sync"){notice="";pull(true)}
  else if(a==="copy-summary"){copyText(summary(S.games[currentId]),"Resumen copiado. Ya puedes pegarlo en WhatsApp.")}
});

function summary(g){
  var c=calc(g);
  return g.player+(g.dorsal?" (#"+g.dorsal+")":"")+" vs "+g.rival+" · "+fmtDate(g.date)+(venueTxt(g)?" · "+venueTxt(g).toLowerCase():"")+"\n"+
  (g.final?"Resultado: "+g.final.us+"–"+g.final.them+"\n":"")+
  "Puntos: "+c.pts+" · T2 "+c.m2+"/"+c.a2+" · T3 "+c.m3+"/"+c.a3+" · TL "+c.mft+"/"+c.aft+"\n"+
  "Rebotes "+c.reb+" ("+c.oreb+" at. + "+c.dreb+" def.) · Asist. "+c.ast+" · Robos "+c.stl+" · Tapones "+c.blk+"\n"+
  "Pérdidas "+c.tov+" · Faltas "+c.pf+" · Faltas recibidas "+c.fd;
}
function copyText(t,okMsg){
  function fallback(){notice="No se ha podido copiar automáticamente. Selecciona el texto y cópialo.";render();
    var holder=document.getElementById("copy-fallback")||app;var ta=document.createElement("textarea");ta.value=t;ta.readOnly=true;ta.style.minHeight="140px";holder.appendChild(ta);ta.focus();ta.select()}
  try{navigator.clipboard.writeText(t).then(function(){notice=okMsg;render()},fallback)}catch(e){fallback()}
}
function realGames(){return games().filter(function(g){return !g.example})}
function backupState(){
  var gs=realGames();
  if(!gs.length)return {text:"Cuando tengas partidos, guarda aquí una copia de vez en cuando."};
  if(!S.lastBackup)return {text:"Todavía no has guardado ninguna copia. Los partidos solo están en este móvil.",warn:true};
  var ch=gs.filter(function(g){return (g.updatedAt||0)>S.lastBackup}).length, d=new Date(S.lastBackup);
  var when=d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"})+" a las "+d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
  if(ch)return {text:"Última copia: "+when+". "+(ch===1?"Hay 1 partido con cambios":"Hay "+ch+" partidos con cambios")+" que aún no están en la copia.",warn:true};
  return {text:"Copia al día. Última copia: "+when+"."};
}
function saveBlob(blob,name){
  var u=URL.createObjectURL(blob),el=document.createElement("a");el.href=u;el.download=name;document.body.appendChild(el);el.click();
  setTimeout(function(){URL.revokeObjectURL(u);el.remove()},2000);
}
function shareText(name,text,mime,title,done){
  var blob=new Blob([text],{type:mime}), file=null;
  try{file=new File([blob],name,{type:mime})}catch(e){}
  if(file&&navigator.canShare&&navigator.share){
    var ok=false;try{ok=navigator.canShare({files:[file]})}catch(e){}
    if(ok){navigator.share({files:[file],title:title}).then(function(){done("shared")},function(err){if(err&&err.name==="AbortError")done("cancel");else{saveBlob(blob,name);done("saved")}});return}
  }
  saveBlob(blob,name);done("saved");
}
function doBackup(){
  var gs=realGames();
  if(!gs.length){notice="Aún no hay partidos que guardar.";render();return}
  var data=JSON.stringify({app:"estadillo",v:1,exportado:new Date().toISOString(),player:S.player,games:gs});
  shareText("estadillo-copia-"+today()+".txt",data,"text/plain","Copia del Estadillo",function(res){
    if(res==="cancel"){notice="No se ha guardado la copia.";render();return}
    S.lastBackup=Date.now();persist();
    notice=res==="shared"?"Copia guardada ("+gs.length+(gs.length===1?" partido).":" partidos)."):"Copia descargada en el móvil (carpeta Descargas o Archivos).";
    render();
  });
}
function csvCell(v){v=v==null?"":String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function doCSV(){
  var gs=realGames().filter(function(g){return g.status==="final"}).sort(function(a,b){return (a.date||"").localeCompare(b.date||"")});
  if(!gs.length){notice="Aún no hay partidos terminados para exportar.";render();return}
  var head=["Fecha","Rival","Lugar","Jugador","Dorsal","Nuestro equipo","Rival puntos","Puntos","T2 anotados","T2 intentos","T3 anotados","T3 intentos","TL anotados","TL intentos","Rebotes ataque","Rebotes defensa","Rebotes","Asistencias","Robos","Tapones","Faltas recibidas","Pérdidas","Faltas","Zona anotados","Zona intentos","Media dist. anotados","Media dist. intentos"];
  var rows=[head];
  gs.forEach(function(g){var c=calc(g),p=(g.date||"").split("-");
    rows.push([p.length===3?p[2]+"/"+p[1]+"/"+p[0]:"",g.rival,venueTxt(g),g.player,g.dorsal,g.final?g.final.us:"",g.final?g.final.them:"",c.pts,c.m2,c.a2,c.m3,c.a3,c.mft,c.aft,c.oreb,c.dreb,c.reb,c.ast,c.stl,c.blk,c.fd,c.tov,c.pf,c.zona[0],c.zona[1],c.media[0],c.media[1]]);
  });
  var text="﻿"+rows.map(function(r){return r.map(csvCell).join(";")}).join("\r\n");
  shareText("estadillo-partidos-"+today()+".csv",text,"text/csv","Partidos (CSV)",function(res){
    notice=res==="cancel"?"":res==="shared"?"CSV enviado.":"CSV descargado en el móvil.";render();
  });
}
function doImport(raw){
  try{var d=JSON.parse(raw);if(!d||!Array.isArray(d.games))throw 0;
    var hadReal=realGames().length>0, n=0;
    d.games.forEach(function(g){if(!g||!g.id||!Array.isArray(g.events))return;var l=S.games[g.id];if(!l||(g.updatedAt||0)>(l.updatedAt||0)){S.games[g.id]=g;if(syncOn()&&S.pending.indexOf(g.id)<0)S.pending.push(g.id);n++}});
    if(d.player&&!hadReal)S.player=d.player;
    if(n&&S.games.ejemplo)delete S.games.ejemplo;
    persist();scheduleSync();notice=n?("Restaurados "+n+(n===1?" partido.":" partidos.")):"Esa copia no tiene partidos nuevos para este móvil.";view="home";render();
  }catch(e){notice="Ese archivo no es una copia del Estadillo. Elige el archivo «estadillo-copia-…» que guardaste.";render()}
}
document.addEventListener("change",function(ev){
  if(ev.target.id!=="restore-input")return;var f=ev.target.files&&ev.target.files[0];if(!f)return;
  var rd=new FileReader();rd.onload=function(){doImport(String(rd.result||""))};rd.onerror=function(){notice="No se ha podido leer el archivo.";render()};rd.readAsText(f);
});

/* ---------- Pantalla siempre encendida ---------- */
var wake=null;
function requestWake(){try{if(navigator.wakeLock&&!wake){navigator.wakeLock.request("screen").then(function(w){wake=w;w.addEventListener("release",function(){wake=null})}).catch(function(){})}}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&view==="game")requestWake();if(document.visibilityState==="hidden")persist()});
window.addEventListener("pagehide",persist);

/* ---------- Copia en Google Sheets ---------- */
if(!S.sync)S.sync={url:"",token:""};
var cloud={status:"off"}, syncTimer=null, flushing=false, showSync=false;
function syncOn(){return !!(S.sync&&S.sync.url&&S.sync.token)}
function setCloud(s){if(cloud.status===s)return;cloud.status=s;if(view==="home")render()}
function scheduleSync(){if(!syncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(flush,2500)}
function api(payload){
  var ctrl=("AbortController" in window)?new AbortController():null, t=setTimeout(function(){ctrl&&ctrl.abort()},25000);
  return fetch(S.sync.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({token:S.sync.token},payload)),signal:ctrl?ctrl.signal:undefined})
    .then(function(r){clearTimeout(t);if(!r.ok)throw new Error("http");return r.json()})
    .then(function(d){if(!d||!d.ok)throw new Error(d&&d.error||"respuesta");return d},function(e){clearTimeout(t);throw e});
}
function flush(){
  if(!syncOn()||flushing)return;
  if(!S.pending.length){setCloud("ok");return}
  flushing=true;setCloud("sync");
  var batch=S.pending.map(function(id){return S.games[id]}).filter(function(g){return g&&!g.example});
  var vers={};batch.forEach(function(g){vers[g.id]=g.updatedAt});
  api({action:"save",games:batch}).then(function(){
    S.pending=S.pending.filter(function(id){var g=S.games[id];return g&&!g.example&&g.updatedAt!==vers[id]});
    flushing=false;persist();setCloud(S.pending.length?"pending":"ok");if(S.pending.length)scheduleSync();
  },function(err){flushing=false;setCloud(err&&err.message==="token"?"badtoken":"pending")});
}
function pull(manual){
  if(!syncOn())return;
  setCloud("sync");
  api({action:"list"}).then(function(d){
    var changed=0,remote={};
    (d.games||[]).forEach(function(r){if(!r||!r.id)return;remote[r.id]=r.updatedAt||0;var l=S.games[r.id];
      if(!l||(r.updatedAt||0)>(l.updatedAt||0)){if(r.id===currentId&&view==="game")return;S.games[r.id]=r;changed++}});
    Object.keys(S.games).forEach(function(k){var g=S.games[k];if(g.example)return;
      if(!(k in remote)||(g.updatedAt||0)>remote[k]){if(S.pending.indexOf(k)<0)S.pending.push(k)}});
    persist();
    if(manual)notice=changed?("Recuperados "+changed+(changed===1?" partido":" partidos")+" de la hoja."):"La hoja no tiene partidos que no estén ya en este móvil.";
    setCloud(S.pending.length?"pending":"ok");
    if(view!=="game")render();
    flush();
  },function(err){setCloud(err&&err.message==="token"?"badtoken":"pending");if(manual){notice="No se ha podido leer la hoja. Revisa la conexión, la dirección y la clave.";render()}});
}
window.addEventListener("online",flush);
setInterval(function(){if(S.pending.length)flush()},30000);

/* ---------- Arranque ---------- */
function start(data){
  data=data||{};
  if(data.view){view=data.view;currentId=data.currentId||null}
  else if(S.activeId&&S.games[S.activeId]&&S.games[S.activeId].status==="live"){view="game";currentId=S.activeId;requestWake()}
  render();
  if(syncOn())pull(false);
}
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
start({});
})();
</script>
